name: Patch XSERVER review docs

on:
  push:
    branches:
      - codex/xserver-production-hardening
    paths:
      - '.github/workflows/patch-xserver-review.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/xserver-production-hardening
          fetch-depth: 0

      - name: Patch README without dropping unrelated documentation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('xserver/README.md')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              "│   ├── 0004_notification_line_retry_key.sql\n│   └── 0005_reservation_page_notice_text.sql",
              "│   ├── 0004_notification_line_retry_key.sql\n│   ├── 0005_reservation_page_notice_text.sql\n│   └── 0006_user_friend_status_checked_at.sql",
          )

          text = text.replace(
              "`claim()` は次の単一UPDATEで送信権を取ります。MySQL はUPDATEで行ロックを取ったあとに\nWHERE句を再評価するため、同時に走った2つ目のUPDATEは `sending` になった行に一致せず0行になります。",
              "単一通知は `claim()`、一括通知は `claimMany()` で送信権を取ります。\n一括通知は対象行を booking_id 昇順に `SELECT ... FOR UPDATE` し、**全件がclaim可能な場合だけ**\n全件を `sending` へ進めます。並行Cronが走っても一括予約の一部だけを送ることはありません。\n単一通知も同じall-or-nothing実装を1件で利用します。",
          )

          friendship_anchor = (
              "- 友だち状態は**LINEログイン時**に取得して `users.is_line_friend` へ保存します。\n"
              "  友だち追加した直後は保存済みの値が古いため、案内カードの\n"
              "  「友だち追加を確認して予約に進む」から**再ログイン**して取り直します。"
          )
          friendship_replacement = friendship_anchor + (
              "\n- `users.friend_status_checked_at` にLINE Platformで最後に確認できた時刻を保存します。"
              " **trueでも5分を超えた確認結果は予約判定では不明扱い**にし、LIFF / LINE Loginでの再確認を必須にします。"
              " 長寿命の `rk_session` Cookieだけで古いtrueを使い続けることはありません。"
          )
          if friendship_anchor not in text:
              raise SystemExit('friendship README anchor not found')
          text = text.replace(friendship_anchor, friendship_replacement, 1)

          text = text.replace(
              "CSPは `/liff` のときだけ、LIFF SDKの配信元（`https://static.line-scdn.net`）と\nLINEのAPI（`https://api.line.me`）を追加で許可します。他のページの\nCSPは従来どおり絞ったままです。",
              "CSPは `/liff` と `/liff/reserve/{slug}` のときだけ、LIFF SDKの配信元\n（`https://static.line-scdn.net`）とLINEのAPI（`https://api.line.me`）を追加で許可します。\nそれ以外のページのCSPは従来どおり絞ったままです。",
          )

          warning_pattern = re.compile(
              r"> \*\*⚠ `public/index\.php` を差し替えるときの注意\*\*\n>\n"
              r"> 本番はドキュメントルートと `app-root` が別ディレクトリのため、\n"
              r"> `public/index\.php` 冒頭の `\$root` を\*\*本番固有の絶対パス\*\*に書き換えてあります。\n>\n"
              r"> ```php\n> \$root = '/home/<account>/yunoizumi\.com/rakko-app';   // 本番の値\n> ```\n>\n"
              r"> リポジトリ版は `\$root = dirname\(__DIR__\);` です。\n"
              r"> \*\*そのまま上書きすると bootstrap が壊れて全ページが500になります。\*\*\n"
              r"> このファイルを反映するときは、必ず本番の `\$root` を維持してください。\n\n"
          )
          replacement = (
              "> **`public/index.php` は本番でも手修正せず、そのまま配置してください。**\n>\n"
              "> app-root は次の順で安全に解決します。\n"
              "> 1. `RAKKO_APP_ROOT` 環境変数（明示override）\n"
              "> 2. リポジトリ標準配置の `dirname(__DIR__)`\n"
              "> 3. XSERVER標準配置の `public_html` と同階層にある `app-root/`\n>\n"
              "> どれにも `app/bootstrap.php` が無ければ、内部パスを出さずHTTP 500で停止します。\n"
              "> Host / URI / GET / POST / Cookie からapp-rootを決めることはありません。\n\n"
          )
          text, count = warning_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'index warning block replacements={count}')

          manual_block = (
              "`xserver/public/` の中身を `public_html/` へ、それ以外を `app-root/` へ配置します。\n"
              "`public/index.php` は `dirname(__DIR__)` を参照するため、\n"
              "`public_html` と `app-root` を並べる構成では index.php 冒頭の `$root` を\n"
              "`/home/<account>/reserve.yunoizumi.com/app-root` に書き換えてください（1行）。"
          )
          if manual_block not in text:
              raise SystemExit('manual app-root block not found')
          text = text.replace(
              manual_block,
              "`xserver/public/` の中身を `public_html/` へ、それ以外を `app-root/` へ配置します。\n"
              "この標準構成では `public/index.php` が兄弟の `app-root/` を自動検出するため、**ファイルの手修正は不要**です。\n"
              "既存環境などでapp-rootの場所が異なる場合だけ、Web実行環境から参照できる `RAKKO_APP_ROOT` に絶対パスを設定してください。",
              1,
          )

          text = text.replace('### 6-7. Cron（リマインド送信）', '### 6-7. Cron（通知送信）')

          forbidden = [
              'index.php 冒頭の `$root`',
              '本番の `$root` を維持',
              '書き換えてください（1行）',
              'CSPは `/liff` のときだけ',
          ]
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise SystemExit('stale README instructions remain: ' + ', '.join(leftovers))
          if text == original:
              raise SystemExit('README was not changed')

          path.write_text(text, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-xserver-review.yml
          git add xserver/README.md
          git commit -m "docs(xserver): align production hardening guide"
          git push origin HEAD:codex/xserver-production-hardening
