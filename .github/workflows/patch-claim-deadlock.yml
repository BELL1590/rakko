name: Patch notification claim deadlock

on:
  push:
    branches:
      - codex/xserver-production-hardening
    paths:
      - '.github/workflows/patch-claim-deadlock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/xserver-production-hardening
          fetch-depth: 0

      - name: Move idempotent row creation outside claim transaction
        shell: python
        run: |
          from pathlib import Path

          p = Path('xserver/app/Repositories/NotificationRepository.php')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '通知行がまだ無い予約は同じトランザクション内で pending 行を作るため、\n     * 予約COMMIT後〜初回通知行作成前にプロセスが落ちたケースもCronから復旧できる。',
              '通知行がまだ無い予約は claim トランザクションの前に INSERT IGNORE で作る。\n     * 行作成自体は冪等で送信権ではないためautocommitとし、同一未作成行へ多数の\n     * プロセスが同時INSERTしてトランザクション同士がdeadlockすることを避ける。\n     * 送信権の all-or-nothing 判定と更新だけを FOR UPDATE のトランザクション内で行う。'
          )

          old = '''        $staleBefore = $this->staleCutoff($now);

        return $this->db->transaction(function (Db $db) use ($ids, $type, $maxAttempts, $now, $staleBefore): ?array {
            // ロック順序を booking_id 昇順に固定し、同時実行時のデッドロックを抑える。
            foreach ($ids as $bookingId) {
                $db->run(
                    'INSERT IGNORE INTO notifications
                       (booking_id, notification_type, status, attempt_count,
                        line_retry_key, created_at, updated_at)
                     VALUES (?, ?, \\'pending\\', 0, ?, ?, ?)',
                    [$bookingId, $type, Uuid::v4(), $now, $now]
                );
            }

            $placeholders = implode(',', array_fill(0, count($ids), '?'));'''
          new = '''        $staleBefore = $this->staleCutoff($now);

        // 行作成は送信権の取得ではない。トランザクション外のautocommitで先に確定し、
        // 多数プロセスが同じ未作成行へ同時INSERTすることで起きるdeadlockを避ける。
        foreach ($ids as $bookingId) {
            $this->db->run(
                'INSERT IGNORE INTO notifications
                   (booking_id, notification_type, status, attempt_count,
                    line_retry_key, created_at, updated_at)
                 VALUES (?, ?, \\'pending\\', 0, ?, ?, ?)',
                [$bookingId, $type, Uuid::v4(), $now, $now]
            );
        }

        return $this->db->transaction(function (Db $db) use ($ids, $type, $maxAttempts, $now, $staleBefore): ?array {
            // ここからが送信権。全対象行を同じ順序でロックし、全件可否を一括判定する。
            $placeholders = implode(',', array_fill(0, count($ids), '?'));'''
          if old not in s:
              raise SystemExit('claimMany target block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Align app-root regression assertion
        shell: python
        run: |
          from pathlib import Path
          p = Path('xserver/tests/ProductionHardeningTest.php')
          s = p.read_text(encoding='utf-8')
          old = "assertContains('is_file($bootstrap)', $source, 'bootstrap存在確認を行う');"
          new = "assertContains('is_file($candidateBootstrap)', $source, '候補ごとにbootstrap存在確認を行う');"
          if old not in s:
              raise SystemExit('app-root assertion target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-claim-deadlock.yml
          git add xserver/app/Repositories/NotificationRepository.php xserver/tests/ProductionHardeningTest.php
          git commit -m "fix(xserver): avoid notification claim deadlocks"
          git push origin HEAD:codex/xserver-production-hardening
