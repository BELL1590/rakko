name: Patch hardening review test

on:
  push:
    branches:
      - codex/xserver-production-hardening
    paths:
      - '.github/workflows/patch-hardening-test.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/xserver-production-hardening
          fetch-depth: 0
      - name: Fix literal assertion and remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('xserver/tests/ProductionHardeningReviewTest.php')
          s = p.read_text(encoding='utf-8')
          old = 'assertNotContains("$root = \'/home/", $source, \'本番固有パスを埋め込まない\');'
          new = 'assertNotContains("\\$root = \'/home/", $source, \'本番固有パスを埋め込まない\');'
          if old not in s:
              raise SystemExit('target assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-hardening-test.yml
          git add xserver/tests/ProductionHardeningReviewTest.php
          git commit -m "test(xserver): fix hardening literal assertion"
          git push origin HEAD:codex/xserver-production-hardening
